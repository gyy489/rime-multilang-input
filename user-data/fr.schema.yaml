# Rime schema
# encoding: utf-8

schema:
  schema_id: fr
  name: Français
  version: "2026-05-16"
  author:
    - "Generated from hermitdave/FrequencyWords"
  description: |
    French table dictionary for mixed Chinese / English / French input.

switches:
  - name: ascii_mode
    reset: 0
    states: [FR, ASCII]

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"
  algebra:
    # 仅保留轻量容错，避免法语候选因模糊匹配过多而扩散。
    # 词头相邻字母互换（只做一处，避免索引膨胀）
    - derive/^([a-z])([a-z])/$2$1/
    # 拼写容错：重复字母误输入为单个字母
    - derive/ll/l/
    - derive/ss/s/
    - derive/tt/t/
    - derive/ee/e/

translator:
  dictionary: fr
  enable_completion: true
  enable_sentence: false
  enable_user_dict: true
  spelling_hints: 0

key_binder:
  import_preset: default

recognizer:
  import_preset: default
